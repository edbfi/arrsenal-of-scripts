name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''
      expected-default-sha:
        description: Exact default-branch commit requested after a checked merge
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v2.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
  scripts:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # renovate: datasource=pypi depName=basedpyright
      BASEDPYRIGHT_VERSION: '1.40.1'
      # renovate: datasource=github-releases depName=FiloSottile/age
      AGE_VERSION: '1.3.2'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Log resolved toolchain
        run: |
          uv --version
          python --version
          go version
      - name: Install encryption and shell test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          go install "filippo.io/age/cmd/...@v${AGE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bash .github/scripts/check.sh
      - run: git diff --exit-code HEAD
  required:
    name: ci / required
    if: always()
    needs: [guard, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v2.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
      - uses: edbfi/automation/actions/gate@v2.0.0
        with:
          needs: ${{ toJSON(needs) }}
          required: guard scripts
