# Copy to the repo root; preserve existing project hooks. Keep this filename: Dependabot's
# pre-commit updater can't read prek.toml. CI runs prek run --all-files --hook-stage manual.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Local only: it scans --staged, so it finds nothing under --all-files.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/edbfi/edbfi-ci
    rev: d07ccc13141d4aee4fa28546f4328f4e48d5363b  # frozen: v0.1.0
    hooks:
      - id: privileged-jobs

  - repo: local
    hooks:
      # identify tags *.zsh as shell too; zsh files get their own check below.
      - id: bash-syntax
        name: Bash syntax
        language: system
        types: [shell]
        exclude_types: [zsh]
        # Run once per file: bash -n otherwise checks only its first argument.
        require_serial: true
        entry: bash -c 'for file; do bash -n "$file" || exit; done' --
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck -S error
        language: system
        types: [shell]
        exclude_types: [zsh]
      - id: zsh-syntax
        name: Zsh syntax
        language: system
        types: [zsh]
        # Run once per file: zsh -n otherwise checks only its first argument.
        require_serial: true
        entry: bash -c 'for file; do zsh -n "$file" || exit; done' --
      # The age and GNU tar tests skip themselves when the tool is missing.
      - id: backup-tests
        name: Backup script tests
        entry: python3 -m unittest discover -s server-scripts/backup/python -p test_*.py
        language: python
        language_version: "3.14"
        pass_filenames: false
        always_run: true
      - id: basedpyright
        name: Python types
        entry: uvx basedpyright@latest
        language: system
        pass_filenames: false
        always_run: true
      # Each dev-tools project is its own uv project with its own [tool.basedpyright]
      # table; -p is required because pyright prefers the root pyrightconfig.json.
      - id: upkeep
        name: upkeep (typing gate, types, lint, tests)
        language: system
        pass_filenames: false
        files: ^dev-tools/upkeep/
        entry: >-
          bash -c 'cd dev-tools/upkeep
          && python3 tools/typing_gate.py
          && uv run --frozen uvx basedpyright@latest -p pyproject.toml
          && uv run --frozen ruff check .
          && uv run --frozen ruff format --check .
          && uv run --frozen pytest -q'
      - id: t3-antigravity-acp
        name: t3-antigravity-acp (typing gate, types, tests)
        language: system
        pass_filenames: false
        files: ^dev-tools/t3-antigravity-acp/
        entry: >-
          bash -c 'cd dev-tools/t3-antigravity-acp
          && python3 tools/typing_gate.py
          && uvx basedpyright@latest -p pyproject.toml
          && python3 -m unittest discover -s tests -q'
